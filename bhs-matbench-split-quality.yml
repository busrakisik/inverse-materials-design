name: BHS Matbench label-blind split quality audit
'on':
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type AUDIT_SPLIT_QUALITY to authorize re-download and label-free audit'
        required: true
        type: string
permissions:
  contents: read
jobs:
  audit:
    if: ${{ inputs.confirmation == 'AUDIT_SPLIT_QUALITY' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test audit logic without downloading data
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_split_quality_audit.py' -v 2>&1 | tee split_quality_test_log.txt
          grep -Eq '^Ran 6 tests? in ' split_quality_test_log.txt
          grep -Eq '^OK$' split_quality_test_log.txt
      - name: Install pinned chemical composition parser
        run: |
          python -m pip install 'pymatgen==2026.10.24'
          python -m pip check
      - name: Recreate frozen label-blind split from verified source
        run: |
          python scripts/matbench_split_gate.py --execute --output runs/split_v1_regenerated.json
      - name: Assert match with original split counts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('runs/split_v1_regenerated.json').read_text())
          assert {p:m['partitions'][p]['row_count'] for p in ('train','validation','test')}=={'train':3282,'validation':647,'test':675}
          assert {p:m['partitions'][p]['chemical_system_count'] for p in ('train','validation','test')}=={'train':2640,'validation':523,'test':542}
          assert m['labels_in_manifest'] is False
          PY
      - name: Audit chemical-group size and cross-partition element overlap
        run: |
          python scripts/split_quality_audit.py --execute --manifest runs/split_v1_regenerated.json --output runs/split_quality_audit_v1.json
      - name: Preserve label-free audit records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bhs-matbench-split-quality-audit-v1
          path: |
            runs/split_quality_audit_v1.json
            split_quality_test_log.txt
          if-no-files-found: warn
          retention-days: 30
