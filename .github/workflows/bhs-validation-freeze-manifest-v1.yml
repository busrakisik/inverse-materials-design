name: BHS Validation Freeze Evidence Manifest v1
on:
  push:
    branches: [bhs-scientific-audit]
    paths:
      - 'scripts/validation_freeze_manifest_v1.py'
      - 'tests/test_validation_freeze_manifest_v1.py'
      - 'research/VALIDATION_FREEZE_MANIFEST_V1.md'
      - '.github/workflows/bhs-validation-freeze-manifest-v1.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  metadata-no-holdout:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.9'
      - name: Run 12 evidence manifest tests
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_validation_freeze_manifest_v1.py' -v 2>&1 | tee freeze_manifest_tests.log
          grep -Eq '^Ran 12 tests? in ' freeze_manifest_tests.log
          grep -Eq '^OK$' freeze_manifest_tests.log
      - name: Record evidence manifest only (no holdout)
        run: python -m scripts.validation_freeze_manifest_v1
      - name: Upload evidence and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bhs-validation-freeze-evidence-manifest-v1
          path: |
            freeze_manifest_tests.log
            runs/validation_freeze_manifest_v1/
          if-no-files-found: warn
