
name: BHS NIST Kerr Prequential Model Adequacy v3
on:
  push:
    branches: [bhs-scientific-audit]
    paths:
      - 'scripts/nist_model_adequacy_v3.py'
      - 'tests/test_nist_model_adequacy_v3.py'
      - 'research/NIST_MODEL_ADEQUACY_V3.md'
      - 'research/BHS_PROJECT_HANDOFF.md'
      - 'research/BHS_EVIDENCE_REGISTER.json'
      - '.github/workflows/bhs-nist-model-adequacy-v3.yml'
      - 'scripts/nist_anonymous_offline_pilot_v1.py'
      - 'scripts/multivariate_hypotheses_v1.py'
      - 'scripts/nist_dataset_inspection_v1.py'
      - 'scripts/nist_composition_mapping_v1.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prequential-adequacy-development-no-holdout:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned numerical libraries
        run: python -m pip install numpy==1.26.4 scipy==1.13.1 scikit-learn==1.5.2
      - name: Unit tests on synthetic-only observations
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_nist_model_adequacy_v3.py' -v 2>&1 | tee nist_model_adequacy_v3_tests.log
          grep -Eq '^Ran 31 tests? in ' nist_model_adequacy_v3_tests.log
          grep -Eq '^OK$' nist_model_adequacy_v3_tests.log
      - name: Pinned NIST Kerr adaptive prequential development diagnostics
        shell: bash
        run: |
          set -euo pipefail
          python -m scripts.nist_model_adequacy_v3 --fetch
          python - <<'PY'
          import hashlib, json, math
          from pathlib import Path
          root = Path('runs/nist_model_adequacy_v3')
          raw = (root/'aggregated_prequential_adequacy.json').read_bytes()
          checksum = (root/'aggregated_prequential_adequacy.sha256').read_text().split()[0]
          assert hashlib.sha256(raw).hexdigest() == checksum
          report = json.loads(raw)
          assert report['status']=='NIST_KERR_PREQUENTIAL_ADEQUACY_DEV_ONLY_NOT_VALIDATED'
          assert report['pool']['eligible_samples'] == 921
          for key in ('scored_validation_allowed','independent_holdout_used','physical_validation',
                      'claim_of_superiority','real_lab_experiment_executed','source_element_column_order_verified'):
              assert report[key] is False, key
          assert report['development_only'] is True
          assert report['post_hoc_and_not_pre_registered'] is True
          protocol=report['protocol']
          assert protocol['development_seeds']==[7,13,23,31,41]
          assert protocol['total_budget']==15 and protocol['prequential_forecasts_per_campaign']==12
          assert protocol['all_seeds_already_used_in_prior_development'] is True
          assert len(protocol['selector_policies'])==3 and len(protocol['forecast_models'])==5
          assert set(report['selection_trajectories'])==set(protocol['selector_policies'])
          for trajectory, predictors in report['selection_trajectories'].items():
              assert set(predictors)==set(protocol['forecast_models']), trajectory
              for name, stats in predictors.items():
                  assert stats['development_seed_count']==5, name
                  assert stats['prequential_forecast_count']==60, name
                  assert sum(stats['pit_bin_counts_5'])==60, name
                  assert sum(stats['paired_nlpd_better_tie_worse_vs_gp_length_0p22'].values())==5, name
                  assert 0 <= stats['mean_90pct_interval_coverage'] <= 1, name
                  for key in ('mean_nlpd_standardized_response', 'mean_rmse_standardized_response',
                      'mean_mae_standardized_response', 'mean_90pct_interval_width_standardized_response',
                      'mean_paired_nlpd_minus_gp_length_0p22'):
                      assert math.isfinite(stats[key]), (trajectory,name,key)
          forbidden=('selected_indices','raw_labels','raw_measurements','per_step_forecasts','revealed_y')
          assert not any(s in raw.decode() for s in forbidden)
          print('NIST 3x5 prequential adequacy & scientific claim gates: PASS')
          PY
      - name: Archive aggregate-only reports and synthetic test log
        uses: actions/upload-artifact@v4
        with:
          name: bhs-nist-model-adequacy-v3
          retention-days: 30
          if-no-files-found: error
          path: |
            nist_model_adequacy_v3_tests.log
            runs/nist_model_adequacy_v3/aggregated_prequential_adequacy.json
            runs/nist_model_adequacy_v3/aggregated_prequential_adequacy.sha256
