name: BHS Causal Nonidentifiability v9
on:
  push:
    branches: [bhs-v9-identifiability-counterexample]
    paths:
      - "bhs/decisions/causal_nonidentifiability_v9.py"
      - "tests/test_causal_nonidentifiability_v9.py"
      - "research/BHS_CAUSAL_NONIDENTIFIABILITY_V9.md"
      - "research/BHS_EXTERNAL_LAB_EVIDENCE_INTAKE_V1.md"
      - "research/bhs_v9_exact_counterexample.json"
      - "research/RESEARCH_OVERVIEW.md"
      - "README.md"
      - "README.md"
      - "research/RESEARCH_OVERVIEW.md"
      - ".github/workflows/bhs-causal-identifiability-v9.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  exact-causal-counterexample:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install reviewed v8 cryptographic dependency
        run: |
          python -m pip install cryptography==46.0.4
          python -m pip check
      - name: Preserve v7 evidence-contract regressions
        run: python -m unittest discover -s tests -p 'test_evidence_contract_v7.py' -v
      - name: Preserve v8 reviewer-integrity regressions
        run: python -m unittest discover -s tests -p 'test_verified_review_v8.py' -v
      - name: Test exact v9 counterexamples, minimax regret, and conservative review
        run: python -m unittest discover -s tests -p 'test_causal_nonidentifiability_v9.py' -v
      - name: Generate exact synthetic proof independently of any UCI source
        run: python -m bhs.decisions.causal_nonidentifiability_v9 --out runs/bhs_v9_nonidentifiability.json
      - name: Verify source syntax and professor-facing research references
        run: |
          python -m compileall -q bhs/decisions tests/test_causal_nonidentifiability_v9.py
          python - <<'PY'
          from pathlib import Path
          expected=[
              "research/BHS_CAUSAL_NONIDENTIFIABILITY_V9.md",
              "research/bhs_v9_exact_counterexample.json",
              "bhs/decisions/causal_nonidentifiability_v9.py",
              "tests/test_causal_nonidentifiability_v9.py",
              "research/BHS_PROSPECTIVE_DECISION_RELIABILITY_STUDY_DESIGN.md",
              "research/BHS_EXTERNAL_LAB_EVIDENCE_INTAKE_V1.md",
          ]
          for path in expected:
              assert Path(path).is_file(), "Missing documented source: "+path
          readme=Path("README.md").read_text()
          assert "exactly the same observational distribution" in readme
          assert "not universally optimal" in readme
          print("Verified documented science and source layout.")
          PY
      - name: Verify mathematical counterexample and evidence boundaries
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          proof=json.loads(Path("runs/bhs_v9_nonidentifiability.json").read_text())
          assert proof["type"]=="EXACT_SYNTHETIC_STRUCTURAL_COUNTEREXAMPLE"
          assert proof["observational_law_identical"] is True
          assert proof["causal_effect_range_within_declared_world_set"]==[-5.0,5.0]
          assert proof["status"]=="ABSTAIN_CAUSAL_EFFECT_NOT_IDENTIFIED"
          assert proof["conditional_illustrative_regret"]["minimax_randomized_action_worst"]==2.5
          assert proof["conditional_illustrative_regret"]["abstention_minimax_preferred_for_this_world_set"] is True
          assert proof["identification_proven_from_observations"] is False
          assert proof["world_set_completeness_established"] is False
          assert proof["new_empirical_data_used"] is False
          assert proof["independent_holdout_used"] is False
          assert proof["physical_validation"] is False
          assert proof["automatic_laboratory_action_authorized"] is False
          print("Exact opposing causal effects with identical observations; no empirical claims.")
          PY
      - name: Preserve the verified exact synthetic proof in research files
        if: github.ref == 'refs/heads/bhs-v9-identifiability-counterexample'
        run: |
          cp runs/bhs_v9_nonidentifiability.json research/bhs_v9_exact_counterexample.json
          python - <<'PY'
          import json
          from pathlib import Path
          obj=json.loads(Path("research/bhs_v9_exact_counterexample.json").read_text())
          assert obj["new_empirical_data_used"] is False
          assert obj["identification_proven_from_observations"] is False
          assert obj["physical_validation"] is False
          assert obj["automatic_laboratory_action_authorized"] is False
          assert obj["status"]=="ABSTAIN_CAUSAL_EFFECT_NOT_IDENTIFIED"
          print("Verified stored proof has no empirical or physical validation claims.")
          PY
          sha256sum research/bhs_v9_exact_counterexample.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/bhs_v9_exact_counterexample.json
          if git diff --cached --quiet; then
            echo 'Deterministic symbolic proof unchanged.'
          else
            git commit -m 'evidence: preserve exact synthetic causal nonidentifiability witness'
            git push origin HEAD:bhs-v9-identifiability-counterexample
          fi
      - name: Archive deterministic synthetic counterexample
        uses: actions/upload-artifact@v4
        with:
          name: bhs-v9-exact-causal-nonidentifiability-only
          path: runs/bhs_v9_nonidentifiability.json
          if-no-files-found: error
          retention-days: 21
