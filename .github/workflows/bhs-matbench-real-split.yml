# Manual-only real Matbench split audit. No predictive benchmark or label release.
name: BHS Matbench real label-blind chemical-system split
'on':
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type CREATE_LABEL_BLIND_SPLIT to authorize re-download and split manifest'
        type: string
        required: true
permissions:
  contents: read
jobs:
  real-split:
    if: ${{ inputs.confirmation == 'CREATE_LABEL_BLIND_SPLIT' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: ${{ github.workspace }}
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v4
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check source and research protocol
        run: |
          test -s scripts/matbench_split_gate.py
          test -s scripts/acquire_matbench_expt_gap.py
          test -s tests/test_matbench_split_gate.py
          test -s research/SPLIT_GATE_V1.md
          python -m py_compile scripts/matbench_split_gate.py scripts/acquire_matbench_expt_gap.py tests/test_matbench_split_gate.py
      - name: Run 10 synthetic contract tests before real split
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_matbench_split_gate.py' -v 2>&1 | tee real_split_contract_tests.log
          grep -Eq '^Ran 10 tests? in ' real_split_contract_tests.log
          grep -Eq '^OK$' real_split_contract_tests.log
      - name: Install pinned composition parser
        run: |
          python -m pip install 'pymatgen==2026.10.24'
          python -m pip check
      - name: Generate label-blind split using verified source bytes
        run: |
          python scripts/matbench_split_gate.py --execute --output runs/matbench_real_split_v1.json
      - name: Audit manifest invariants and print counts only
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from scripts.matbench_split_gate import validate_manifest, EXPECTED_SOURCE_SHA
          p = Path('runs/matbench_real_split_v1.json')
          m = json.loads(p.read_text(encoding='utf-8'))
          assert validate_manifest(m)
          assert m['source_compressed_sha256'] == EXPECTED_SOURCE_SHA
          assert m['label_accessed_by_splitter'] is False
          assert m['labels_in_manifest'] is False
          assert m['benchmark_run'] is False
          partitions = m['partitions']
          assert sum(partitions[k]['row_count'] for k in ('train','validation','test')) == 4604
          assert all(partitions[k]['row_count'] > 0 for k in ('train','validation','test'))
          print(json.dumps({'status':m['status'], 'row_counts':{k:partitions[k]['row_count'] for k in ('train','validation','test')}, 'chemical_system_counts':{k:partitions[k]['chemical_system_count'] for k in ('train','validation','test')}, 'labels_in_manifest':m['labels_in_manifest'], 'benchmark_run':m['benchmark_run']}, indent=2))
          PY
      - name: Upload split manifest and contract test log (no experimental labels)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bhs-matbench-real-label-blind-split-v1
          path: |
            runs/matbench_real_split_v1.json
            real_split_contract_tests.log
          if-no-files-found: warn
          retention-days: 30
