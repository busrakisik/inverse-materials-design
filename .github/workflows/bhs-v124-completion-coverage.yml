name: BHS V12.4 Matched Completion and Decision Contracts

on:
  push:
    branches: [bhs-v124-completion-coverage-audit]
    paths:
      - "scripts/bhs_v124_completion_coverage_audit.py"
      - "tests/test_bhs_v124_completion_coverage_audit.py"
      - "research/BHS_V124_MATCHED_COMPLETION_PROTOCOL.md"
      - ".github/workflows/bhs-v124-completion-coverage.yml"

permissions:
  contents: read

jobs:
  source-independent-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: ${{ github.workspace }}
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate immutable prior implementation and frozen protocol
        run: |
          test "$(git rev-parse HEAD:scripts/bhs_v123_synthetic_decision_audit.py)" = 'c467dd6b1c7ae22b3bb2ae37da61d4f857a8cbae'
          test "$(git rev-parse HEAD:scripts/bhs_v122_adaptive_gp_reference.py)" = 'b80b23e80ee0cd99503c85fbef59cb15c5cf6039'
          test "$(git rev-parse HEAD:research/BHS_V124_MATCHED_COMPLETION_PROTOCOL.md)" = 'cdc408d8fe1967b41938c0bba23e02a8d2569e62'
      - name: Pin numerical dependencies
        run: |
          python -m pip install numpy==1.26.4 scipy==1.13.1 scikit-learn==1.5.2 pandas==2.2.3
          python -m pip check
      - name: Verify inherited acquisition and source-independent contracts
        run: |
          python -m unittest discover -s tests -p 'test_bhs_measurement_allocation_v12.py' -v
          python -m unittest discover -s tests -p 'test_bhs_v121_order_contracts.py' -v
          python -m unittest discover -s tests -p 'test_bhs_v122_adaptive_gp_reference.py' -v
          python -m unittest discover -s tests -p 'test_bhs_v123_synthetic_decision_audit.py' -v
      - name: Verify V12.4 fairness, ledger and abstention contracts
        run: |
          python -m unittest discover -s tests -p 'test_bhs_v124_completion_coverage_audit.py' -v
          python -m scripts.bhs_v124_completion_coverage_audit
      - name: Confirm that no outcome-scored replay was invoked
        run: |
          test ! -e runs/bhs_v124_completion_coverage.json
          echo 'Source-independent tests passed; no outcome-scored study was executed.'
