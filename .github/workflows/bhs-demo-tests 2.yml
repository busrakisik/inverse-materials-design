# BEGIN OF COMPLETE BHS 852-TEST WORKFLOW — CHECK THIS LINE ON GITHUB
# BHS software and scientific-claim safety tests only; no empirical materials validation.
# Real pymatgen structures are tested; CHGNet/MLFF calculations are mocked or NOT_RUN.
name: BHS demo and provenance checks

'on':
  push:
    branches:
      - bhs-scientific-audit
    paths:
      - 'bhs/**'
      - 'src/imd_pipeline/agents/bayesian_reasoner.py'
      - 'src/imd_pipeline/agents/consensus_engine.py'
      - 'src/imd_pipeline/agents/literature_agent.py'
      - 'src/imd_pipeline/agents/hypothesis_engine.py'
      - 'src/imd_pipeline/agents/search_planner.py'
      - 'src/imd_pipeline/validation/real_calculators.py'
      - 'src/imd_pipeline/validation/mlff_validator.py'
      - 'src/imd_pipeline/validation/property_filter.py'
      - 'src/imd_pipeline/validation/ensemble_validator.py'
      - 'src/imd_pipeline/validation/validation_engine.py'
      - 'src/imd_pipeline/pipeline/orchestrator.py'
      - 'app.py'
      - 'tests/test_reconstruction_run.py'
      - 'tests/test_ablation_matrix.py'
      - 'tests/test_benchmarks.py'
      - 'tests/test_reports.py'
      - 'tests/test_provenance.py'
      - 'tests/test_evidence.py'
      - 'tests/test_physics.py'
      - 'tests/test_consensus.py'
      - 'tests/test_legacy_bayesian.py'
      - 'tests/test_legacy_literature.py'
      - 'tests/test_legacy_hypothesis.py'
      - 'tests/test_legacy_search_planner.py'
      - 'tests/test_legacy_mlff.py'
      - 'tests/test_legacy_property_filter.py'
      - 'tests/test_legacy_ensemble.py'
      - 'tests/test_legacy_validation_engine.py'
      - 'tests/test_legacy_orchestrator.py'
      - 'tests/test_legacy_app.py'
      - 'configs/reconstruction_lifepo4.yaml'
      - '.github/workflows/bhs-demo-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  demo-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out selected branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install focused test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest PyYAML pymatgen

      - name: Compile audited modules and focused tests
        run: |
          python -m py_compile \
            bhs/cli.py \
            bhs/search/bayesian_engine.py \
            bhs/provenance/tags.py \
            bhs/provenance/bundle.py \
            bhs/benchmarks/suite_20.py \
            bhs/benchmarks/baselines.py \
            bhs/evidence/likelihoods.py \
            bhs/physics/relaxer.py \
            bhs/reports/generate_artifacts.py \
            src/imd_pipeline/agents/bayesian_reasoner.py \
            src/imd_pipeline/agents/consensus_engine.py \
            src/imd_pipeline/agents/literature_agent.py \
            src/imd_pipeline/agents/hypothesis_engine.py \
            src/imd_pipeline/agents/search_planner.py \
            src/imd_pipeline/validation/real_calculators.py \
            src/imd_pipeline/validation/mlff_validator.py \
            src/imd_pipeline/validation/property_filter.py \
            src/imd_pipeline/validation/ensemble_validator.py \
            src/imd_pipeline/validation/validation_engine.py \
            src/imd_pipeline/pipeline/orchestrator.py \
            app.py \
            tests/test_provenance.py \
            tests/test_evidence.py \
            tests/test_physics.py \
            tests/test_consensus.py \
            tests/test_legacy_bayesian.py \
            tests/test_legacy_literature.py \
            tests/test_legacy_hypothesis.py \
            tests/test_legacy_search_planner.py \
            tests/test_legacy_mlff.py \
            tests/test_legacy_property_filter.py \
            tests/test_legacy_ensemble.py \
            tests/test_legacy_validation_engine.py \
            tests/test_legacy_orchestrator.py \
            tests/test_legacy_app.py

      - name: Run 852 scoped BHS software and safety tests
        run: |
          python -m pytest -q \
            tests/test_reconstruction_run.py \
            tests/test_ablation_matrix.py \
            tests/test_benchmarks.py \
            tests/test_reports.py \
            tests/test_provenance.py \
            tests/test_evidence.py \
            tests/test_physics.py \
            tests/test_consensus.py \
            tests/test_legacy_bayesian.py \
            tests/test_legacy_literature.py \
            tests/test_legacy_hypothesis.py \
            tests/test_legacy_search_planner.py \
            tests/test_legacy_mlff.py \
            tests/test_legacy_property_filter.py \
            tests/test_legacy_ensemble.py \
            tests/test_legacy_validation_engine.py \
            tests/test_legacy_orchestrator.py \
            tests/test_legacy_app.py

# END OF COMPLETE BHS 852-TEST WORKFLOW — CHECK THIS LINE ON GITHUB
