name: BHS v12.20 Historic Campaign Decision-Time Source Gate

on:
  push:
    branches: [bhs-v1220-decision-time-source-admission]
    paths:
      - 'research/BHS_V1220_ADTS_DECISION_TIME_PROTOCOL.md'
      - 'scripts/bhs_v1220_campaign_decision_time_gate.py'
      - 'tests/test_bhs_v1220_campaign_decision_time_gate.py'
      - '.github/workflows/bhs-v1220-decision-time.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  no-historical-counterfactual-leakage:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: .
      PYTHONHASHSEED: '0'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify frozen first source protocol, new code and negative ancestors
        run: |
          test "$(git rev-parse HEAD:research/BHS_V1220_ADTS_DECISION_TIME_PROTOCOL.md)" = 'e8627160d67afba65d95c21aa9f68268117483d7'
          test "$(git rev-parse HEAD:scripts/bhs_v1220_campaign_decision_time_gate.py)" = '1ea9891b554668076ffe4bd8edc799b20eee6031'
          test "$(git rev-parse HEAD:tests/test_bhs_v1220_campaign_decision_time_gate.py)" = 'aea4619cb7c1ddc30ddd3ede079764aeee1a944f'
          test "$(git rev-parse HEAD:research/BHS_V1219_FIRST_TRACE_SOURCE_ACCESS_AUDIT.md)" = '9b4a22951e8b3f4ad003bee70eee582f21ded08b'
          test "$(git rev-parse HEAD:research/BHS_V1218_FIRST_SYNTHETIC_HYPOTHESIS_RESULTS.md)" = '217b02ef744603dcda639140fcf99896f820fcfe'
          test "$(git rev-parse HEAD:research/BHS_REPLICATE_POOL_V11_RESULTS.md)" = '400ac9271dbf24f229a8b50823af773d1c0b6ea5'
      - name: Install pinned scientific test dependencies
        run: |
          python -m pip install numpy==1.26.4 scipy==1.13.1 scikit-learn==1.5.2 pandas==2.2.3 pytest==8.3.4
          python -m pip check
      - name: Test actual field timing, missing outcomes and inherited scientific contracts
        run: |
          python -m unittest discover -s tests -p 'test_bhs_v1220_campaign_decision_time_gate.py' -v
          python -m unittest discover -s tests -p 'test_bhs_v1219_trace_source_lineage_gate.py' -v
          python -m unittest discover -s tests -p 'test_bhs_v1218_dual_predictive_hypotheses.py' -v
          python -m unittest discover -s tests -p 'test_bhs_v1217_architecture_readiness.py' -v
          python -m unittest discover -s tests -p 'test_bhs_replicate_pool_v11.py' -v
          python -m pytest -q tests/test_legacy_hypothesis.py tests/test_legacy_bayesian.py tests/test_legacy_search_planner.py
      - name: Emit first source-only feasibility / counterfactual no-go decision
        run: |
          mkdir -p runs
          python -m scripts.bhs_v1220_campaign_decision_time_gate --out runs/bhs_v1220_first_campaign_decision_time_no_go.json
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('runs/bhs_v1220_first_campaign_decision_time_no_go.json').read_text())
          assert r['schema']=='BHS-V12.20-CAMPAIGN-DECISION-TIME-GATE'
          assert r['published_source_records_total']==25387
          assert r['published_source_records_valid']==13250
          assert r['published_source_invalid_or_other']==12137
          assert len(r['proposed_gcs_design_recipe_keys'])==11
          assert r['counts_from_published_article_not_recomputed_csv'] is True
          assert r['original_campaign_csv_column_mapping_verified'] is False
          assert r['source_metadata_bytes_verified'] is False
          assert r['historic_policy_snapshot_verified'] is False
          assert r['counterfactual_responses_available'] is False
          assert r['logging_propensities_verified'] is False
          assert r['independent_holdout_used'] is False
          assert r['scored_validation_allowed'] is False
          assert r['full_bhs_fair_comparison_ready'] is False
          assert r['decision']=='NO_GO_ADTS_2024_POLICY_TIME_AND_COUNTERFACTUALS_UNVERIFIED'
          print('Unchosen physical outcomes cannot be scored as if measured.')
          PY
          sha256sum runs/bhs_v1220_first_campaign_decision_time_no_go.json
      - name: Retain complete original source-only readiness result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bhs-v1220-first-decision-time-counterfactual-no-go
          path: runs/bhs_v1220_first_campaign_decision_time_no_go.json
          if-no-files-found: warn
          retention-days: 90
          compression-level: 0
