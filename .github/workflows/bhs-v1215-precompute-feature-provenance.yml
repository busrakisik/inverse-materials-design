name: BHS v12.15 Precomputation Feature Provenance

on:
  push:
    branches: [bhs-v1215-precompute-feature-provenance]
    paths:
      - 'research/BHS_V1215_FEATURE_PROVENANCE_PROTOCOL.md'
      - 'scripts/bhs_v1215_precompute_feature_provenance.py'
      - 'tests/test_bhs_v1215_precompute_feature_provenance.py'
      - '.github/workflows/bhs-v1215-precompute-feature-provenance.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-only-feature-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: .
      PYTHONHASHSEED: '0'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify preregistered protocol and exact source functions
        run: |
          test "$(git rev-parse HEAD:research/BHS_V1215_FEATURE_PROVENANCE_PROTOCOL.md)" = 'dee8a1cc15f273ab3163cb3a4f489ebc538ed0c2'
          test "$(git rev-parse HEAD:scripts/bhs_v1215_precompute_feature_provenance.py)" = 'e0d4076612b5bdd42fca9f39256d131be1e2a98b'
          test "$(git rev-parse HEAD:tests/test_bhs_v1215_precompute_feature_provenance.py)" = 'de1c4c8eba6f7656f4de024be922377851be4e30'
          test "$(git rev-parse HEAD:scripts/bhs_v1214_group_split_readiness.py)" = '8eff5a38fcadb257849bdbfbea78bd9b03323bb1'
          test "$(git rev-parse HEAD:scripts/bhs_v1213_source_intake.py)" = '064a25de0c36af1413898e3e823dcdf7930fc59a'
          test "$(git rev-parse HEAD:research/BHS_V1214_FIRST_STRUCTURAL_SPLIT_RESULTS.md)" = '75d345d5ae3f77fb4331a4f6349bd6129af95d12'
      - name: New and inherited source-only adversarial tests
        run: |
          python -m unittest discover -s tests -p 'test_bhs_v1213_source_intake.py' -v
          python -m unittest discover -s tests -p 'test_bhs_v1213_identity_diagnostic.py' -v
          python -m unittest discover -s tests -p 'test_bhs_v1213_primitive_key_audit.py' -v
          python -m unittest discover -s tests -p 'test_bhs_v1214_element_cardinality_diagnostic.py' -v
          python -m unittest discover -s tests -p 'test_bhs_v1214_group_split_readiness.py' -v
          python -m unittest discover -s tests -p 'test_bhs_v1215_precompute_feature_provenance.py' -v
      - name: Retain past scientific contract dependencies
        run: |
          python -m pip install numpy==1.26.4 scipy==1.13.1 scikit-learn==1.5.2 pandas==2.2.3
          python -m pip check
      - name: Retain historic negative and conditional research contracts
        run: |
          python -m unittest discover -s tests -p 'test_bhs_measurement_allocation_v12.py' -v
          python -m unittest discover -s tests -p 'test_bhs_v121_order_contracts.py' -v
          python -m unittest discover -s tests -p 'test_bhs_v122_adaptive_gp_reference.py' -v
          python -m unittest discover -s tests -p 'test_bhs_v123_synthetic_decision_audit.py' -v
          python -m unittest discover -s tests -p 'test_bhs_v124_completion_coverage_audit.py' -v
          python -m unittest discover -s tests -p 'test_bhs_v125_disjoint_calibration.py' -v
          python -m unittest discover -s tests -p 'test_bhs_v126_group_risk_intake_contracts.py' -v
          python -m unittest discover -s tests -p 'test_bhs_v127_hypothesis_readiness.py' -v
          python -m unittest discover -s tests -p 'test_bhs_v128_design_estimability.py' -v
          python -m unittest discover -s tests -p 'test_bhs_v129_design_attrition.py' -v
          python -m unittest discover -s tests -p 'test_bhs_v1210_assignment_unit.py' -v
          python -m unittest discover -s tests -p 'test_bhs_v1211_external_feasibility.py' -v
          python -m unittest discover -s tests -p 'test_bhs_v1212_precision_sensitivity.py' -v
      - name: Audit original published CSV field availability only
        run: |
          mkdir -p runs
          python -m scripts.bhs_v1215_precompute_feature_provenance --out runs/bhs_v1215_first_source_feature_coverage.json
          python - <<'PY'
          import json
          from pathlib import Path
          a=json.loads(Path('runs/bhs_v1215_first_source_feature_coverage.json').read_text())
          assert a['source_sha256']=='825f0b7c783c51213adb47bd1366023f0861e8a21b904113d9d3871c3daa0fc2'
          assert a['row_count']==4289 and a['header_count']==90
          assert a['gb_count']==6 and a['element_count']==91
          assert a['target_blank_strings']==30
          assert a['original_combined_identifier_blanks']==110
          assert a['precalculation_geometry_certified'] is False
          assert a['scored_validation_allowed'] is False
          assert a['real_cost_verified'] is False
          assert a['approved_numerical_geometry_predictor_columns']==[]
          assert a['raw_values_or_scientific_outcomes_inspected'] is False
          for v in a['candidate_column_coverage'].values():
              assert v['populated_rows']+v['blank_rows']==4289
              assert v['chronology_verified'] is False
              assert v['predecision_feature_approved'] is False
          print('Feature existence, not chronology, is audited. NO-GO remains.')
          PY
          sha256sum runs/bhs_v1215_first_source_feature_coverage.json
      - name: Preserve original source-coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bhs-v1215-first-source-feature-presence-only
          path: runs/bhs_v1215_first_source_feature_coverage.json
          if-no-files-found: warn
          retention-days: 90
          compression-level: 0
