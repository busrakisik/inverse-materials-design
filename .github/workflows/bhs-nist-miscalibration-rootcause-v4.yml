name: BHS NIST Kerr Miscalibration Decomposition v4
on:
  push:
    branches: [bhs-scientific-audit]
    paths:
      - 'scripts/nist_miscalibration_rootcause_v4.py'
      - 'tests/test_nist_miscalibration_rootcause_v4.py'
      - 'research/NIST_MISCALIBRATION_ROOTCAUSE_V4.md'
      - 'research/BHS_PROJECT_HANDOFF.md'
      - 'research/BHS_EVIDENCE_REGISTER.json'
      - '.github/workflows/bhs-nist-miscalibration-rootcause-v4.yml'
      - 'scripts/nist_model_adequacy_v3.py'
      - 'scripts/nist_anonymous_offline_pilot_v1.py'
      - 'scripts/nist_dataset_inspection_v1.py'
      - 'scripts/nist_composition_mapping_v1.py'
      - 'scripts/multivariate_hypotheses_v1.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  posthoc-development-miscalibration-no-holdout:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned numerical dependencies
        run: python -m pip install numpy==1.26.4 scipy==1.13.1 scikit-learn==1.5.2
      - name: Test predictive variance arithmetic, original-v3 parity, and pre-reveal isolation
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_nist_miscalibration_rootcause_v4.py' -v 2>&1 | tee nist_miscalibration_v4_tests.log
          grep -Eq '^Ran 36 tests? in ' nist_miscalibration_v4_tests.log
          grep -Eq '^OK$' nist_miscalibration_v4_tests.log
      - name: Read pinned NIST source and run posthoc prequential decomposition
        shell: bash
        run: |
          set -euo pipefail
          python -m scripts.nist_miscalibration_rootcause_v4 --fetch
          python - <<'PY'
          import hashlib, json, math
          from pathlib import Path
          p=Path('runs/nist_miscalibration_rootcause_v4')
          raw=(p/'aggregated_rootcause_diagnostics.json').read_bytes()
          digest=(p/'aggregated_rootcause_diagnostics.sha256').read_text().split()[0]
          assert hashlib.sha256(raw).hexdigest()==digest
          r=json.loads(raw)
          assert r['status']=='NIST_KERR_MISCALIBRATION_DECOMPOSITION_POSTHOC_NOT_VALIDATED'
          assert r['pool']['eligible_samples']==921
          for k in ('independent_holdout_used','scored_validation_allowed','physical_validation',
                    'claim_of_superiority','real_lab_experiment_executed','source_column_to_element_order_verified'):
              assert r[k] is False,k
          assert r['development_only'] and r['post_hoc_and_not_pre_registered']
          cfg=r['protocol']
          assert cfg['seeds']==[7,13,23,31,41]
          assert cfg['total_budget']==15 and cfg['initial_observations']==3
          assert cfg['prequential_forecasts_per_campaign']==12
          assert cfg['hypothetical_additional_discrepancy_sd']==[0.0,0.5,1.0,2.0]
          assert len(cfg['selection_policies'])==3 and len(cfg['predictors'])==3
          from scripts.nist_miscalibration_rootcause_v4 import verify_v3_reproduction
          assert verify_v3_reproduction(r) is True
          for history,forecasters in r['selection_trajectories'].items():
              assert set(forecasters)==set(cfg['predictors']), history
              for model,s in forecasters.items():
                  assert s['count']==60 and s['development_seed_count']==5, (history,model)
                  assert sum(q['count'] for q in s['by_nearest_coordinate_distance'].values())==60
                  assert s['by_acquisition_phase']['early']['count']==30
                  assert s['by_acquisition_phase']['late']['count']==30
                  assert abs(s['mean_total_variance']-(s['mean_assumed_noise_variance']+
                         s['mean_within_family_variance']+s['mean_between_family_variance']))<1e-8
                  assert 0<=s['mean_90pct_coverage']<=1
                  for field in ('mean_signed_residual','mean_squared_error',
                    'mean_squared_standardized_error','mean_nlpd','mean_total_variance'):
                      assert math.isfinite(s[field]),(history,model,field)
                  for tau,stats in s['posthoc_additive_discrepancy_sd_sensitivity'].items():
                      assert tau in ('0.0','0.5','1.0','2.0')
                      assert 0<=stats['mean_90pct_coverage']<=1
                      assert math.isfinite(stats['mean_nlpd'])
                  assert abs(s['posthoc_additive_discrepancy_sd_sensitivity']['0.0']['mean_nlpd']-s['mean_nlpd'])<1e-8
          banned=('selected_indices','raw_labels','raw_measurements','per_step_forecasts','revealed_y')
          assert not any(s in raw.decode() for s in banned)
          print('NIST 540 prequential root-cause diagnostic scores, v3 parity, claim gates: PASS')
          PY
      - name: Archive aggregate-only diagnostics and test log
        uses: actions/upload-artifact@v4
        with:
          name: bhs-nist-miscalibration-rootcause-v4
          retention-days: 30
          if-no-files-found: error
          path: |
            nist_miscalibration_v4_tests.log
            runs/nist_miscalibration_rootcause_v4/aggregated_rootcause_diagnostics.json
            runs/nist_miscalibration_rootcause_v4/aggregated_rootcause_diagnostics.sha256
