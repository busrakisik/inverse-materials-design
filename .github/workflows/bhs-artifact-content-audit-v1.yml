name: BHS Artifact Content Audit v1
on:
  push:
    branches: [bhs-scientific-audit]
    paths:
      - 'scripts/artifact_content_audit_v1.py'
      - 'tests/test_artifact_content_audit_v1.py'
      - 'research/ARTIFACT_CONTENT_AUDIT_V1.md'
      - '.github/workflows/bhs-artifact-content-audit-v1.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-evidence-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run artifact-content validation contracts (no holdout)
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_artifact_content_audit_v1.py' -v 2>&1 | tee artifact_content_tests.log
          grep -Eq '^Ran 8 tests? in ' artifact_content_tests.log
          grep -Eq '^OK$' artifact_content_tests.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bhs-artifact-content-audit-v1-log
          path: artifact_content_tests.log
