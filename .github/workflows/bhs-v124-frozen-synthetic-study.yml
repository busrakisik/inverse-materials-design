name: BHS V12.4 First Frozen Synthetic Development Study

on:
  push:
    branches: [bhs-v124-frozen-synthetic-study]
    paths:
      - ".github/workflows/bhs-v124-frozen-synthetic-study.yml"

permissions:
  contents: read

jobs:
  frozen-development-only:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: ${{ github.workspace }}
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify locked source, test and protocol identities
        run: |
          test "$(git rev-parse HEAD:scripts/bhs_v124_completion_coverage_audit.py)" = 'c7f04720e7a804c3f1e87a43cb34fb0c5834319f'
          test "$(git rev-parse HEAD:tests/test_bhs_v124_completion_coverage_audit.py)" = '36788fd31f84911a8e29c58b8f4adf9c0c98e471'
          test "$(git rev-parse HEAD:research/BHS_V124_MATCHED_COMPLETION_PROTOCOL.md)" = 'cdc408d8fe1967b41938c0bba23e02a8d2569e62'
          test "$(git rev-parse HEAD:scripts/bhs_v123_synthetic_decision_audit.py)" = 'c467dd6b1c7ae22b3bb2ae37da61d4f857a8cbae'
          test "$(git rev-parse HEAD:scripts/bhs_v122_adaptive_gp_reference.py)" = 'b80b23e80ee0cd99503c85fbef59cb15c5cf6039'
      - name: Pin numerical dependencies
        run: |
          python -m pip install numpy==1.26.4 scipy==1.13.1 scikit-learn==1.5.2 pandas==2.2.3
          python -m pip check
      - name: Verify acquired-data isolation, budget and safety contracts
        run: |
          python -m unittest discover -s tests -p 'test_bhs_v124_completion_coverage_audit.py' -v
      - name: Execute first fixed manufactured 96-campaign development study
        run: |
          python -m scripts.bhs_v124_completion_coverage_audit --execute --out runs/bhs_v124_completion_coverage.json
          sha256sum runs/bhs_v124_completion_coverage.json
      - name: Validate frozen study consistency without changing scores
        run: |
          python - <<'PY'
          import itertools
          import json
          import math
          from pathlib import Path
          x=json.loads(Path('runs/bhs_v124_completion_coverage.json').read_text())
          assert x['historical_source_accessed'] is False
          assert x['physical_experiments_performed'] is False
          assert x['measurement_budget']==48
          assert x['decision_seeds']==[19,29]
          assert x['response_order_variants']==[0,1]
          assert x['landscapes']==['ridge','oscillatory']
          assert x['regimes']==['constant','varying']
          policies=['random_bundled','gp_ard_bundled','gp_pooled_noise_ivr',
                    'gp_pooled_noise_ei','evidence_gate_native','evidence_gate_completion']
          assert x['policies']==policies
          rows=x['campaigns']
          assert len(rows)==96
          keys={(r['landscape'],r['regime'],r['seed'],r['order_variant'],r['policy']) for r in rows}
          assert keys==set(itertools.product(
              ['ridge','oscillatory'],['constant','varying'],[19,29],[0,1],policies))
          assert len(x['synthetic_source_digests'])==4
          for r in rows:
              assert r['total_measured_responses']==48
              assert r['completed_designs']*3+r['stranded_partial_responses']==48
              assert r['incomplete_designs']<=3
              assert r['latent_outcomes_passed_to_selector'] is False
              assert r['future_responses_passed_to_selector'] is False
              assert type(r['accepted_primary']) is bool
              assert math.isfinite(r['primary_loss']) and r['primary_loss']>=0
              assert len(r['decision_grid'])==3
              primary=next(d for d in r['decision_grid'] if d['z']==1.0)
              assert r['primary_loss']==primary['loss_by_penalty']['0.50']
              assert r['accepted_primary']==primary['accepted']
              assert r['primary_loss']==(r['latent_recommendation_regret'] if
                                        r['accepted_primary'] else 0.5)
              if r['policy']!='evidence_gate_native':
                  assert r['incomplete_designs']==0
                  assert r['stranded_partial_responses']==0
                  assert r['completed_designs']==16
          assert set(x['aggregates'])==set(policies)
          for p,a in x['aggregates'].items():
              assert a['campaign_count']==16
              assert len(a['coverage_loss_grid'])==9
              assert 0<=a['primary_coverage']<=1
          assert x['hard_gates']['development_only'] is True
          for key,value in x['hard_gates'].items():
              if key!='development_only': assert value is False, key
          print('First synthetic development run preserved exactly 96 matched-budget campaigns.')
          PY
      - name: Preserve first aggregate development report even if checks fail
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: bhs-v124-first-frozen-synthetic-development-only
          path: runs/bhs_v124_completion_coverage.json
          if-no-files-found: warn
          retention-days: 90
