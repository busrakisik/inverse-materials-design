name: BHS v12.9 Lossless Design Evidence Integrity

on:
  push:
    branches: [bhs-v129-attrition-evidence-archive]
    paths:
      - 'research/BHS_V129_FIRST_DESIGN_ATTRITION_REPORT.md'
      - 'research/bhs_v129_first_design_attrition.json.xz'
      - '.github/workflows/bhs-v129-attrition-archive.yml'

permissions:
  contents: read

jobs:
  archive-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify frozen method and archived source identities
        run: |
          test "$(git rev-parse HEAD:scripts/bhs_v129_design_attrition.py)" = '32e8a47b93543336621289446b3ca89ec7dc78e6'
          test "$(git rev-parse HEAD:tests/test_bhs_v129_design_attrition.py)" = '908c1cb65f7dd925c1e7e0bc480d458548946aae'
          test "$(git rev-parse HEAD:research/BHS_V129_DESIGN_VARIANTS.json)" = '0dbd73ce65c48239e94a8e611faa450056217f8d'
          test "$(git rev-parse HEAD:research/BHS_V129_ATTRITION_RESILIENCE_PROTOCOL.md)" = '317438b1b66cd68d71bd498e3a498ead8abcb98e'
          test "$(git rev-parse HEAD:research/BHS_V128_MANUFACTURED_DESIGN_FIXTURE.json)" = '3cde6a6ad809effdf21fcdd50ab737c8cfaf07e8'
          test "$(git rev-parse HEAD:research/bhs_v129_first_design_attrition.json.xz)" = '272e9c4e6a68300e3ef856c11919ba0fcb3737eb'
          echo 'e65e85a6c2d1a8fed749fdd3502c9021343ca53bb01fb0ec06306101961abde6  research/BHS_V129_DESIGN_VARIANTS.json' | sha256sum --check
          echo 'b12e043f4c5141809c88e116f3a175e694ad1966230aa3891bffd43dec9e40a5  research/bhs_v129_first_design_attrition.json.xz' | sha256sum --check
      - name: Restore exact result and enforce permanent physical no-go
        run: |
          xz -dc research/bhs_v129_first_design_attrition.json.xz > /tmp/bhs_v129_first_design_attrition.json
          echo '4fa0af8d2947a89153e1a7a07d6b2553d63e956c1ad86ea2a598d5b43a6da28f  /tmp/bhs_v129_first_design_attrition.json' | sha256sum --check
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('/tmp/bhs_v129_first_design_attrition.json').read_text())
          assert x['physical_measurements_performed'] is False
          assert x['formal_power_or_precision_established'] is False
          assert x['independent_physical_validation_established'] is False
          assert x['physical_recommendation_allowed'] is False
          assert x['laboratory_action_allowed'] is False
          assert x['status']=='NO_GO_EXTERNAL_LAB_AND_PRECISION_REVIEW_REQUIRED'
          a=x['variants']['cross_session_pairs']
          b=x['variants']['within_session_pairs']
          assert a['full_design']['coupon_rows']==b['full_design']['coupon_rows']==16
          assert a['batch_loss_nominal_pass_count']==b['batch_loss_nominal_pass_count']==8
          assert a['session_loss_nominal_pass_count']==0
          assert b['session_loss_nominal_pass_count']==2
          assert a['full_design']['residual_row_degrees_of_freedom']==4
          assert b['full_design']['residual_row_degrees_of_freedom']==5
          assert all(not z['physical_recommendation_allowed'] for z in (a,b))
          print('Original outcome-free structural report is byte-identical; physical release stays blocked.')
          PY
