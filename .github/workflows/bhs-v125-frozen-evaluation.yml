name: BHS v12.5 Frozen Disjoint Evaluation

on:
  push:
    branches: [bhs-v125-frozen-evaluation]
    paths:
      - '.github/workflows/bhs-v125-frozen-evaluation.yml'

permissions:
  contents: read
  actions: read

jobs:
  locked-evaluation:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONPATH: ${{ github.workspace }}
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTHONHASHSEED: '0'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify unchanged calibration protocol and implementation
        run: |
          test "$(git rev-parse HEAD:research/BHS_V125_FROZEN_CALIBRATION_HANDOFF.md)" = 'e39d2dad46ad57fa3c434049a3aaed42a0bfd6ff'
          test "$(git rev-parse HEAD:research/BHS_V125_DISJOINT_CALIBRATION_PROTOCOL.md)" = '719431338ee9cd0b3ecc50d197b946aeb79c4701'
          test "$(git rev-parse HEAD:scripts/bhs_v125_disjoint_calibration.py)" = 'fa5419b0a65b7b83fafe214d2c18b9df4f0e04e7'
          test "$(git rev-parse HEAD:tests/test_bhs_v125_disjoint_calibration.py)" = '4a1f802f86050bea9f18f4d0475c895247158ee0'
          test "$(git rev-parse HEAD:scripts/bhs_v124_completion_coverage_audit.py)" = 'c7f04720e7a804c3f1e87a43cb34fb0c5834319f'
      - name: Install pinned numerical dependencies
        run: |
          python -m pip install numpy==1.26.4 scipy==1.13.1 scikit-learn==1.5.2 pandas==2.2.3
          python -m pip check
      - name: Verify calibration integrity software checks
        run: python -m unittest discover -s tests -p 'test_bhs_v125_disjoint_calibration.py' -v
      - name: Download original frozen calibration from exact earlier run
        run: |
          mkdir -p runs
          gh run download 42382124635 --repo busrakisik/inverse-materials-design --name bhs-v125-calibration-frozen-development --dir runs
          test -f runs/bhs_v125_calibration.json
          echo 'fe47b0f79d04ff45df39498559d59dbfc941796c2d195dec4b1cfa4e406cfd48  runs/bhs_v125_calibration.json' | sha256sum --check --status
          python - <<'PY'
          import json
          from pathlib import Path
          from scripts.bhs_v125_disjoint_calibration import verify_calibration_document
          obj = json.loads(Path('runs/bhs_v125_calibration.json').read_text())
          keys = verify_calibration_document(obj)
          assert len(keys) == 6
          assert {z['group'] for z in obj['calibration_rows']} == {101, 103, 107, 109}
          assert obj['untouched_evaluation_groups'] == [211, 223, 227, 229]
          print('Original frozen calibration verified without evaluation access.')
          PY
      - name: Run disjoint evaluation with calibration-only thresholds
        run: |
          python -m scripts.bhs_v125_disjoint_calibration --stage evaluation --frozen runs/bhs_v125_calibration.json --out runs/bhs_v125_evaluation.json
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('runs/bhs_v125_evaluation.json').read_text())
          assert x['stage'] == 'evaluation'
          assert x['calibration_file_sha256'] == 'fe47b0f79d04ff45df39498559d59dbfc941796c2d195dec4b1cfa4e406cfd48'
          assert x['calibration_groups'] == [101, 103, 107, 109]
          assert x['evaluation_groups'] == [211, 223, 227, 229]
          assert len(x['evaluation_rows']) == 48
          assert {r['group'] for r in x['evaluation_rows']} == {211, 223, 227, 229}
          assert all(r['split'] == 'evaluation' and r['measurement_count'] == 48 for r in x['evaluation_rows'])
          assert all(not r['latent_outcomes_passed_to_selector'] and not r['future_responses_passed_to_selector'] for r in x['evaluation_rows'])
          assert x['hard_gates']['development_only'] is True
          assert x['hard_gates']['claim_of_superiority'] is False
          assert len(x['metrics_by_policy_and_coverage']) == 6
          print('Disjoint evaluation integrity verified; no physical source accessed.')
          PY
          sha256sum runs/bhs_v125_calibration.json runs/bhs_v125_evaluation.json
      - name: Preserve calibration and evaluation even when verification fails
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: bhs-v125-disjoint-evaluation-first-development
          path: |
            runs/bhs_v125_calibration.json
            runs/bhs_v125_evaluation.json
          retention-days: 90
          if-no-files-found: warn
          compression-level: 0
