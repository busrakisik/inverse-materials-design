name: BHS v12.10 Assignment Unit and Processing Scope Contracts

on:
  push:
    branches: [bhs-v1210-assignment-unit-contracts]
    paths:
      - 'scripts/bhs_v1210_assignment_unit.py'
      - 'tests/test_bhs_v1210_assignment_unit.py'
      - 'research/BHS_V1210_ASSIGNMENT_UNIT_FIXTURES.json'
      - 'research/BHS_V1210_ASSIGNMENT_UNIT_FEASIBILITY_PROTOCOL.md'
      - '.github/workflows/bhs-v1210-assignment-unit.yml'

permissions:
  contents: read

jobs:
  assignment-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: ${{ github.workspace }}
      PYTHONHASHSEED: '0'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify original V12.9 source remains intact
        run: |
          test "$(git rev-parse HEAD:research/BHS_V129_DESIGN_VARIANTS.json)" = '0dbd73ce65c48239e94a8e611faa450056217f8d'
          test "$(git rev-parse HEAD:scripts/bhs_v129_design_attrition.py)" = '32e8a47b93543336621289446b3ca89ec7dc78e6'
          test "$(git rev-parse HEAD:scripts/bhs_v128_design_estimability.py)" = 'de89ac8d63485afd59b0076c4ea075a12475f089'
      - name: Verify new source identity
        run: |
          test "$(git rev-parse HEAD:scripts/bhs_v1210_assignment_unit.py)" = 'a41a34962710d31965477b3533f2bba6ba5a7c2b'
          test "$(git rev-parse HEAD:tests/test_bhs_v1210_assignment_unit.py)" = '9c66286ca6fe93153909b3dd9f3fa9fc696ec030'
          test "$(git rev-parse HEAD:research/BHS_V1210_ASSIGNMENT_UNIT_FIXTURES.json)" = 'e93e5630cbae7c63dcbb069a0a095b3182a3f349'
          echo 'adc920e2eba62c7e86ad93b227a0327c692952e0bbb2036907c38326974a5a42  research/BHS_V1210_ASSIGNMENT_UNIT_FIXTURES.json' | sha256sum --check
      - name: Install pinned numerical test libraries
        run: |
          python -m pip install numpy==1.26.4 scipy==1.13.1 scikit-learn==1.5.2 pandas==2.2.3
          python -m pip check
      - name: Verify all inherited research contracts
        run: |
          python -m unittest discover -s tests -p 'test_bhs_measurement_allocation_v12.py' -v
          python -m unittest discover -s tests -p 'test_bhs_v121_order_contracts.py' -v
          python -m unittest discover -s tests -p 'test_bhs_v122_adaptive_gp_reference.py' -v
          python -m unittest discover -s tests -p 'test_bhs_v123_synthetic_decision_audit.py' -v
          python -m unittest discover -s tests -p 'test_bhs_v124_completion_coverage_audit.py' -v
          python -m unittest discover -s tests -p 'test_bhs_v125_disjoint_calibration.py' -v
          python -m unittest discover -s tests -p 'test_bhs_v126_group_risk_intake_contracts.py' -v
          python -m unittest discover -s tests -p 'test_bhs_v127_hypothesis_readiness.py' -v
          python -m unittest discover -s tests -p 'test_bhs_v128_design_estimability.py' -v
          python -m unittest discover -s tests -p 'test_bhs_v129_design_attrition.py' -v
      - name: Verify processing scope and independent unit contracts
        run: |
          python -m unittest discover -s tests -p 'test_bhs_v1210_assignment_unit.py' -v
      - name: Evaluate source-only paired design alternatives
        run: |
          mkdir -p runs
          python -m scripts.bhs_v1210_assignment_unit --fixtures research/BHS_V1210_ASSIGNMENT_UNIT_FIXTURES.json --out runs/bhs_v1210_assignment_unit_audit.json
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('runs/bhs_v1210_assignment_unit_audit.json').read_text())
          assert x['physical_measurements_performed'] is False
          assert x['physical_recommendation_allowed'] is False
          assert x['laboratory_action_allowed'] is False
          assert x['formal_sample_size_established'] is False
          assert x['status']=='NO_GO_EXTERNAL_PROCESSING_SCOPE_AND_LAB_REVIEW_REQUIRED'
          assert x['scenarios']['postdeposition_coupon']['full_design']['named_deposition_runs']==8
          assert x['scenarios']['deposition_run']['full_design']['named_deposition_runs']==16
          for mode in x['scenarios'].values():
              assert mode['full_design']['coupon_rows']==16
              assert mode['full_design']['technical_traces']==48
              assert mode['session_loss_nominal_pass_count']==2
              assert mode['event_loss_nominal_pass_count']==16
          print('Plan-only results retain false physical release gates.')
          PY
          sha256sum runs/bhs_v1210_assignment_unit_audit.json
      - name: Retain exact development-only plan report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: bhs-v1210-processing-scope-development-audit
          path: runs/bhs_v1210_assignment_unit_audit.json
          retention-days: 90
          if-no-files-found: warn
          compression-level: 0
