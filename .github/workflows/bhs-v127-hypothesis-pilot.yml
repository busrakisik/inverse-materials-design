name: BHS v12.7 Materials Hypothesis Pilot Contracts

on:
  push:
    branches: [bhs-v127-material-hypothesis-pilot]
    paths:
      - 'scripts/bhs_v127_hypothesis_readiness.py'
      - 'tests/test_bhs_v127_hypothesis_readiness.py'
      - 'research/BHS_V127_FECONI_PHYSICAL_PILOT_PROTOCOL.md'
      - 'research/BHS_V127_FECONI_PILOT_PASSPORT.json'
      - '.github/workflows/bhs-v127-hypothesis-pilot.yml'

permissions:
  contents: read

jobs:
  hypothesis-pilot-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: ${{ github.workspace }}
      PYTHONHASHSEED: '0'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Pin pilot and prior scientific source contracts
        run: |
          test "$(git rev-parse HEAD:research/BHS_V127_FECONI_PHYSICAL_PILOT_PROTOCOL.md)" = '4a31f403c580b91dca475c2fd373c93cb2350c87'
          test "$(git rev-parse HEAD:research/BHS_V127_FECONI_PILOT_PASSPORT.json)" = 'd3fb4c46092ac8e51959d8cecbf0d2a365dec663'
          test "$(git rev-parse HEAD:scripts/bhs_v126_group_risk_intake_contracts.py)" = '19b2aa364a4677a20f20e69d30666ff0bf9a29f6'
          test "$(git rev-parse HEAD:scripts/bhs_v125_disjoint_calibration.py)" = 'fa5419b0a65b7b83fafe214d2c18b9df4f0e04e7'
          test "$(git rev-parse HEAD:research/bhs_v126_group_risk_audit.json.xz)" = '80ac20533e18390aa902f3281c4e2f8c952bcc90'
      - name: Install pinned numerical libraries for inherited tests
        run: |
          python -m pip install numpy==1.26.4 scipy==1.13.1 scikit-learn==1.5.2 pandas==2.2.3
          python -m pip check
      - name: Verify new hypothesis-readiness contracts
        run: |
          python -m unittest discover -s tests -p 'test_bhs_v127_hypothesis_readiness.py' -v
      - name: Verify inherited research and measurement contracts
        run: |
          python -m unittest discover -s tests -p 'test_bhs_measurement_allocation_v12.py' -v
          python -m unittest discover -s tests -p 'test_bhs_v121_order_contracts.py' -v
          python -m unittest discover -s tests -p 'test_bhs_v122_adaptive_gp_reference.py' -v
          python -m unittest discover -s tests -p 'test_bhs_v123_synthetic_decision_audit.py' -v
          python -m unittest discover -s tests -p 'test_bhs_v124_completion_coverage_audit.py' -v
          python -m unittest discover -s tests -p 'test_bhs_v125_disjoint_calibration.py' -v
          python -m unittest discover -s tests -p 'test_bhs_v126_group_risk_intake_contracts.py' -v
      - name: Verify scientific no-go response without opening physical data
        run: |
          mkdir -p runs
          python -m scripts.bhs_v127_hypothesis_readiness --passport research/BHS_V127_FECONI_PILOT_PASSPORT.json --out runs/bhs_v127_pilot_readiness.json
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          p=Path('research/BHS_V127_FECONI_PILOT_PASSPORT.json')
          x=json.loads(Path('runs/bhs_v127_pilot_readiness.json').read_text())
          assert x['passport_sha256']==hashlib.sha256(p.read_bytes()).hexdigest()
          assert x['structural_contract_passed'] is True
          assert x['blocking_count'] >= 20
          assert x['decision']=='NO_GO_EXTERNAL_REVIEW_REQUIRED'
          assert x['laboratory_action_allowed'] is False
          assert x['physical_recommendation_allowed'] is False
          assert x['independent_physical_validation_established'] is False
          assert x['statistical_risk_guarantee_established'] is False
          print('Pilot remains explicitly unapproved and absent physical results.')
          PY
          sha256sum runs/bhs_v127_pilot_readiness.json
      - name: Retain exact development-only readiness report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: bhs-v127-proposed-materials-pilot-readiness
          path: runs/bhs_v127_pilot_readiness.json
          retention-days: 90
          if-no-files-found: warn
          compression-level: 0
