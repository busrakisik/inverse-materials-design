
# Lightweight BHS research-prototype checks.
# No CHGNet calculation, GPU experiment, materials discovery, or calibrated likelihood validation.
name: BHS demo and provenance checks

'on':
  push:
    branches:
      - bhs-scientific-audit
    paths:
      - 'bhs/**'
      - 'tests/test_ablation_matrix.py'
      - 'tests/test_benchmarks.py'
      - 'tests/test_reports.py'
      - 'tests/test_reconstruction_run.py'
      - 'tests/test_provenance.py'
      - 'tests/test_evidence.py'
      - 'configs/reconstruction_lifepo4.yaml'
      - '.github/workflows/bhs-demo-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  demo-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the selected branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install demo and real pymatgen evidence-test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest PyYAML pymatgen

      - name: Compile Python files needed by the demo
        run: |
          python -m py_compile \
            bhs/cli.py \
            bhs/search/bayesian_engine.py \
            bhs/provenance/tags.py \
            bhs/provenance/bundle.py \
            bhs/benchmarks/suite_20.py \
            bhs/benchmarks/baselines.py \
            bhs/evidence/likelihoods.py \
            bhs/reports/generate_artifacts.py \
            tests/test_provenance.py \
            tests/test_evidence.py

      - name: Run 72 demo, provenance, and pymatgen evidence tests
        run: |
          python -m pytest -q \
            tests/test_reconstruction_run.py \
            tests/test_ablation_matrix.py \
            tests/test_benchmarks.py \
            tests/test_reports.py \
            tests/test_provenance.py \
            tests/test_evidence.py

# END OF BHS DEMO WORKFLOW
