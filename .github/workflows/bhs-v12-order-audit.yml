name: BHS V12 Reference Order Diagnostic (Development Only)

on:
  push:
    branches: [bhs-v12-locked-development-replay]
    paths:
      - "scripts/bhs_v12_order_audit.py"
      - ".github/workflows/bhs-v12-order-audit.yml"

permissions:
  contents: read

jobs:
  source-order-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: ${{ github.workspace }}
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Pin numeric libraries
        run: |
          python -m pip install numpy==1.26.4 scipy==1.13.1 scikit-learn==1.5.2 pandas==2.2.3
          python -m pip check
      - name: Compare original and artificial measurement order without exposing source responses
        run: |
          python -m scripts.bhs_v12_order_audit
