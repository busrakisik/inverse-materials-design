name: BHS Pinned Evidence Reconciliation v1
on:
  push:
    branches: [bhs-scientific-audit]
    paths:
      - 'scripts/evidence_reconciliation_v1.py'
      - 'tests/test_evidence_reconciliation_v1.py'
      - 'research/EVIDENCE_RECONCILIATION_V1.md'
      - '.github/workflows/bhs-evidence-reconciliation-v1.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  reconcile-no-holdout:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.9'
      - name: Run evidence reconciliation tests
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_evidence_reconciliation_v1.py' -v 2>&1 | tee reconciliation_tests.log
          grep -Eq '^Ran 10 tests? in ' reconciliation_tests.log
          grep -Eq '^OK$' reconciliation_tests.log
      - name: Verify five historical artifact ZIPs and reconcile source digests
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m scripts.evidence_reconciliation_v1
      - name: Upload diagnostics and reconciliation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bhs-evidence-reconciliation-v1
          path: |
            reconciliation_tests.log
            runs/evidence_reconciliation_v1/
          if-no-files-found: warn
