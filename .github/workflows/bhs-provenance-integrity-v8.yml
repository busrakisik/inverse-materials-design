name: BHS v8 Provenance Integrity and Falsification
on:
  push:
    branches: [bhs-v8-provenance-integrity]
    paths:
      - "bhs/decisions/verified_review_v8.py"
      - "tests/test_verified_review_v8.py"
      - "research/BHS_PROVENANCE_INTEGRITY_V8.md"
      - "research/BHS_PROSPECTIVE_DECISION_RELIABILITY_STUDY_DESIGN.md"
      - "research/RESEARCH_OVERVIEW.md"
      - "README.md"
      - ".github/workflows/bhs-provenance-integrity-v8.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-boundaries:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pin for deterministic cryptographic test dependency
        run: |
          python -m pip install cryptography==46.0.4
          python -m pip check
      - name: Verify original v7 constraints remain unchanged
        run: python -m unittest discover -s tests -p 'test_evidence_contract_v7.py' -v
      - name: Run adversarial v8 integrity contracts
        run: python -m unittest discover -s tests -p 'test_verified_review_v8.py' -v
      - name: Confirm real UCI v6 evidence cannot be escalated
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from bhs.decisions.evidence_contract_v7 import v6_source_case
          from bhs.decisions.verified_review_v8 import guarded_assessment
          real=json.loads(Path('research/uci_concrete_assumptions_v6.json').read_text())
          e=v6_source_case(real)
          levels=('descriptive','observational','laboratory')
          outcomes={level:guarded_assessment(level,e) for level in levels}
          assert outcomes['descriptive']['status']=='DESCRIPTIVE_REPORT_ONLY'
          assert outcomes['observational']['status']=='REQUEST_ADDITIONAL_EVIDENCE'
          assert outcomes['laboratory']['status']=='REQUEST_ADDITIONAL_EVIDENCE'
          assert all(not out['automatic_laboratory_action_authorized'] for out in outcomes.values())
          result={
              'study':'BHS v8 integrity preflight applied to existing v6 observational aggregate',
              'source':'UCI 165 existing exploratory development records',
              'not_new_experimental_measurements':True,
              'not_independent_validation':True,
              'physical_validation':False,
              'cryptographic_attestation_supplied_for_real_data':False,
              'decisions':{name:{
                  'status':out['status'],
                  'missing_evidence':out.get('evidence_requested',[]),
                  'automatic_laboratory_action_authorized':False,
              } for name,out in outcomes.items()}
          }
          Path('runs').mkdir(exist_ok=True)
          Path('runs/bhs_v8_existing_evidence_review.json').write_text(json.dumps(result,indent=2)+'\n')
          print(json.dumps({k:v['status'] for k,v in outcomes.items()},indent=2))
          PY
      - name: Archive synthetic/software-only verification result
        uses: actions/upload-artifact@v4
        with:
          name: bhs-v8-development-only-provenance-verification
          path: runs/bhs_v8_existing_evidence_review.json
          if-no-files-found: error
          retention-days: 21
