name: BHS MCTS Exploratory Development Benchmark v1
on:
  push:
    branches: [bhs-scientific-audit]
    paths:
      - 'scripts/mcts_development_benchmark_v1.py'
      - 'tests/test_mcts_development_benchmark_v1.py'
      - 'research/MCTS_DEVELOPMENT_BENCHMARK_V1.md'
      - '.github/workflows/bhs-mcts-development-benchmark-v1.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exploratory-development-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.9'
      - name: Test exploration contract
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_mcts_development_benchmark_v1.py' -v 2>&1 | tee mcts_development_tests.log
          grep -Eq '^Ran 16 tests? in ' mcts_development_tests.log
          grep -Eq '^OK$' mcts_development_tests.log
      - name: Compare policies on previously used development seeds only
        run: python -m scripts.mcts_development_benchmark_v1 --development-seed-count 5
      - name: Upload exploratory results and test log
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bhs-mcts-exploratory-development-v1
          path: |
            mcts_development_tests.log
            runs/mcts_development_benchmark_v1/
          if-no-files-found: error
