name: BHS Seed and Environment Inventory v1
on:
  push:
    branches: [bhs-scientific-audit]
    paths:
      - 'scripts/seed_environment_inventory_v1.py'
      - 'tests/test_seed_environment_inventory_v1.py'
      - 'research/SEED_ENVIRONMENT_INVENTORY_V1.md'
      - '.github/workflows/bhs-seed-environment-inventory-v1.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static-inventory-only:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify static inventory tests
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_seed_environment_inventory_v1.py' -v 2>&1 | tee inventory_tests.log
          grep -Eq '^Ran 7 tests? in ' inventory_tests.log
          grep -Eq '^OK$' inventory_tests.log
      - name: Inventory without holdout execution
        run: python -m scripts.seed_environment_inventory_v1
      - name: Upload metadata only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bhs-seed-environment-inventory-v1
          path: |
            inventory_tests.log
            runs/seed_environment_inventory_v1/
